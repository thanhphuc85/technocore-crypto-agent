name: Contributions Log

# Tự làm mới contributions-log.md từ dữ liệu SỐNG (KV notes + git + gh + tests)
# rồi commit lại nếu có thay đổi. Chạy theo lịch, thủ công, và sau mỗi push lên main.
on:
  schedule:
    - cron: '17 */6 * * *'        # mỗi 6 giờ (00:17, 06:17, 12:17, 18:17 UTC) — khớp chu kỳ manifest 6h
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'contributions_log.py'
      - '.github/workflows/contributions-log.yml'

permissions:
  contents: write                  # cần để commit file đã cập nhật

concurrency:
  group: contributions-log
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install (for version + tests metrics)
        run: pip install -e .[dev]

      - name: Regenerate &amp; commit (race-proof)
        env:
          GH_TOKEN: ${{ github.token }}     # cho `gh pr list` đếm PR đã merge
          # Danh tính đọc từ Repo Variables (khớp agent_cron) -> FORK tự đóng dấu danh tính
          # RIÊNG vào log của mình. Bỏ trống + là repo gốc -> giữ danh tính tham chiếu; bỏ
          # trống + là fork -> code dẫn xuất danh tính riêng (không mượn danh tính chủ).
          AGENT_NAME: ${{ vars.AGENT_NAME }}
          AGENT_DID: ${{ vars.AGENT_DID }}
          KV_NS: ${{ vars.KV_NS }}
          REPO_URL: ${{ vars.REPO_URL }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Regenerate ON TOP OF the freshest main mỗi lần thử, rồi push. Nếu một run
          # khác chen ngang (push race), reset về main mới và làm lại — không rebase,
          # không conflict, tối đa 3 lần.
          for i in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            python contributions_log.py --quiet
            if git diff --quiet -- contributions-log.md; then
              echo "No change — nothing to commit."; exit 0
            fi
            git add contributions-log.md
            git commit -m "chore: auto-refresh contributions-log.md [skip ci]"
            if git push; then
              echo "Pushed refreshed contributions-log.md."; exit 0
            fi
            echo "Push raced (attempt $i) — retrying against latest main."; sleep 3
          done
          echo "::error::could not push contributions-log.md after 3 attempts"; exit 1
