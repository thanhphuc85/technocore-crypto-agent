name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard-generated-file:
    # contributions-log.md is generated & bot-maintained on main; a PR must not edit it.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Reject hand-edits to contributions-log.md
        run: |
          base="origin/${{ github.base_ref }}"
          if git diff --name-only "$base"...HEAD | grep -qx 'contributions-log.md'; then
            echo "::error file=contributions-log.md::This file is auto-generated and bot-maintained on main by the Contributions Log workflow. Don't commit changes to it in a PR — edit contributions_log.py instead; the bot regenerates the file after merge."
            exit 1
          fi
          echo "OK: PR does not modify the generated contributions-log.md."

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e .[dev]

      - name: Lint (errors only)
        run: ruff check --select=E9,F63,F7,F82 .

      - name: Test
        run: pytest -q --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
