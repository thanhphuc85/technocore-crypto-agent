name: CI

on:
  push:
    branches: [main]
  pull_request:

# Chỉ đọc: CI chạy cả code từ PR (kể cả fork) -> không bao giờ cần quyền ghi.
permissions:
  contents: read

jobs:
  guard-generated-file:
    # contributions-log.md is generated & bot-maintained on main; a PR must not edit it.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5 (pinned)
        with:
          fetch-depth: 0
      - name: Reject hand-edits to contributions-log.md
        run: |
          base="origin/${{ github.base_ref }}"
          if git diff --name-only "$base"...HEAD | grep -qx 'contributions-log.md'; then
            echo "::error file=contributions-log.md::This file is auto-generated and bot-maintained on main by the Contributions Log workflow. Don't commit changes to it in a PR — edit contributions_log.py instead; the bot regenerates the file after merge."
            exit 1
          fi
          echo "OK: PR does not modify the generated contributions-log.md."

  # Workflow cầm seed (agent_cron) và workflow có quyền ghi (contributions-log) chỉ cài từ
  # file khoá + hash. Job này bắt lệch: thêm phụ thuộc vào pyproject mà quên tạo lại khoá
  # thì agent sẽ hỏng lúc chạy thật — báo ở PR thay vì lúc đó.
  lockfiles:
    # Agent chạy trên 24.04 (ghim); 26.04 kiểm sẵn để chuyển có chủ đích sau testnet.
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5 (pinned)
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6 (pinned)
        with:
          python-version: '3.12'
      - name: Agent runtime installs from requirements.lock alone
        run: |
          python -m venv /tmp/rt && /tmp/rt/bin/pip install -q --require-hashes --no-deps -r requirements.lock
          /tmp/rt/bin/python -m pip check
          /tmp/rt/bin/python -c "import agent_cron, token_manager, flop_session, flop_governor, flop_outcomes; print('runtime imports OK')"
      - name: Dev lock installs and collects tests
        run: |
          python -m venv /tmp/dev && /tmp/dev/bin/pip install -q --require-hashes --no-deps -r requirements-dev.lock
          /tmp/dev/bin/python -m pip check
          /tmp/dev/bin/python -m pytest --collect-only -q | tail -1

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5 (pinned)

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6 (pinned)
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e .[dev]

      - name: Lint (errors only)
        run: ruff check --select=E9,F63,F7,F82 .

      - name: Test
        run: pytest -q --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac  # v5.5.5 (pinned)
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
