name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5 (pinned)

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6 (pinned)
        with:
          python-version: '3.12'

      # Job này có id-token: write (publish PyPI): công cụ build cài từ khoá + hash, và build KHÔNG cô lập
      # để setuptools cũng lấy từ khoá — không tải bản mới nhất từ PyPI lúc phát hành.
      - name: Install build tooling
        run: pip install --require-hashes --no-deps -r requirements-build.lock

      - name: Build distributions
        run: python -m build --no-isolation

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2 (pinned)
