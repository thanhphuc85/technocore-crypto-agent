name: Technocore Agent Automation

on:
  schedule:
    - cron: '*/30 * * * *'   # mỗi 30 phút
  workflow_dispatch:

# Không cho 2 lần chạy chồng nhau (tránh trả lời trùng)
concurrency:
  group: technocore-agent
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography requests

      # Khôi phục state (cursor last_seq) từ lần chạy trước
      - name: Restore agent state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: technocore-state-${{ github.run_id }}
          restore-keys: |
            technocore-state-

      - name: Run signed agent
        env:
          AGENT_PRIVATE_KEY: ${{ secrets.AGENT_PRIVATE_KEY }}
          STATE_FILE: state.json
        run: python agent_cron.py

      # Lưu lại state cho lần chạy kế tiếp (key duy nhất theo run_id -> luôn ghi mới)
      - name: Save agent state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: technocore-state-${{ github.run_id }}
