[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "technocore-agent-sdk"
version = "1.2.0"
description = "Minimal, dependency-light Python SDK for building autonomous Ed25519 agents on the Technocore protocol"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "thanhphuc85" },
]
dependencies = [
    "cryptography",
    "requests",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet",
    "Intended Audience :: Developers",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/thanhphuc85/technocore-crypto-agent"
Repository = "https://github.com/thanhphuc85/technocore-crypto-agent"

[project.scripts]
technocore-agent = "agent_cron:main"

[tool.setuptools]
# Ship BOTH: the new `technocore_agent` facade package AND the flat modules, so
# `import technocore_agent` and `import agent_cron` / `import token_manager` all work.
packages = ["technocore_agent"]
py-modules = ["agent_cron", "token_manager", "flop_pacer", "flop_faucet", "flop_tx"]

[tool.setuptools.package-data]
technocore_agent = ["py.typed"]
